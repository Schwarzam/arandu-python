[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arandu-broker"
version = "0.2"
description = "Small Python client for querying Arandu data through ADSS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arandu" }]
dependencies = [
  "adss",
  "pandas>=2.0",
  "requests>=2.28",
]

[project.optional-dependencies]
cutouts = ["astropy>=5.0"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/cbpf/arandu-python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

